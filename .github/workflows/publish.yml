name: Build (CI)

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event_name == 'release' && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'release' ||
      (github.repository == 'clearfeed/html-to-mrkdwn-ts' &&
       !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      filename: ${{ steps.package.outputs.filename }}
      sha256: ${{ steps.package.outputs.sha256 }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Use an OIDC-capable npm version
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Test release guards
        run: node --test .github/scripts/release.test.cjs
      - name: Verify release tag and source
        if: github.event_name == 'release'
        run: node .github/scripts/release.cjs source
      - name: Reject existing versions and latest downgrades
        if: github.event_name == 'release'
        run: node .github/scripts/release.cjs registry
      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22 --force --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies without lifecycle scripts
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Check formatting and run tests
        run: |
          yarn prettier --check "src/**/*.ts"
          yarn test --runInBand
      - name: Build twice and require identical tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/first-pack"
          rm -rf lib
          yarn build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/first-pack"
          rm -rf lib
          yarn build
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          cmp "$RUNNER_TEMP/first-pack/"*.tgz ./*.tgz
          git diff --exit-code
      - name: Pack and validate the release artifact
        id: package
        run: |
          node .github/scripts/release.cjs pack "$RUNNER_TEMP/pack.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'release'
        with:
          name: npm-package
          path: ${{ steps.package.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      github.event_name == 'release' && github.repository == 'clearfeed/html-to-mrkdwn-ts' &&
      !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_FILE: ${{ needs.build.outputs.filename }}
      PACKAGE_SHA256: ${{ needs.build.outputs.sha256 }}
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      # This job never installs or runs repository/dependency code.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Use an OIDC-capable npm version
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
      - name: Verify artifact and recheck the registry before publishing
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const version = process.env.PACKAGE_VERSION;
            assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
            assert.equal(process.env.GITHUB_REF, `refs/tags/v${version}`);
            assert.equal(process.env.PACKAGE_FILE, `clearfeed-ai-html-to-mrkdwn-ts-${version}.tgz`);
            const hash = crypto.createHash('sha256').update(fs.readFileSync(process.env.PACKAGE_FILE)).digest('hex');
            assert.equal(hash, process.env.PACKAGE_SHA256);
            const response = await fetch('https://registry.npmjs.org/@clearfeed-ai%2fhtml-to-mrkdwn-ts', { signal: AbortSignal.timeout(30000) });
            assert(response.ok, `Registry lookup failed: ${response.status}`);
            const metadata = await response.json();
            assert.equal(metadata.name, '@clearfeed-ai/html-to-mrkdwn-ts');
            assert(!metadata.versions[version], 'Stop: version is already published');
            const latest = metadata['dist-tags'].latest;
            assert.match(latest, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
            const requested = version.split('.').map(BigInt);
            const previous = latest.split('.').map(BigInt);
            const difference = requested.findIndex((part, index) => part !== previous[index]);
            assert(difference >= 0 && requested[difference] > previous[difference], 'Stop: release must advance latest');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Publish the validated tarball using GitHub OIDC
        run: npm publish "$PACKAGE_FILE" --access public --tag latest --registry=https://registry.npmjs.org --ignore-scripts
      - name: Verify public registry metadata and downloaded artifact
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const { setTimeout } = require('node:timers/promises');
          (async () => {
            const version = process.env.PACKAGE_VERSION;
            const registry = 'https://registry.npmjs.org/@clearfeed-ai%2fhtml-to-mrkdwn-ts';
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              const response = await fetch(`${registry}?verify=${Date.now()}`, { signal: AbortSignal.timeout(30000) });
              if (!response.ok && response.status < 500) throw new Error(`Registry lookup failed: ${response.status}`);
              const metadata = response.ok ? await response.json() : null;
              const published = metadata?.versions?.[version];
              if (published) {
                assert.equal(metadata['dist-tags'].latest, version);
                const url = `https://registry.npmjs.org/@clearfeed-ai/html-to-mrkdwn-ts/-/html-to-mrkdwn-ts-${version}.tgz`;
                assert.equal(published.dist.tarball, url);
                const download = await fetch(`${url}?verify=${Date.now()}`, { signal: AbortSignal.timeout(30000) });
                if (download.ok) {
                  const bytes = Buffer.from(await download.arrayBuffer());
                  assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), process.env.PACKAGE_SHA256);
                  assert.equal(`sha512-${crypto.createHash('sha512').update(bytes).digest('base64')}`, published.dist.integrity);
                  console.log(`Verified public ${version}, latest tag, and exact tarball bytes.`);
                  return;
                }
                if (download.status !== 404 && download.status < 500) throw new Error(`Tarball download failed: ${download.status}`);
              }
              console.log('npm is still processing the accepted publish; waiting 30 seconds.');
              await setTimeout(30000);
            }
            throw new Error('Upload accepted but public artifact verification timed out. Inspect npm processing; do not republish.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
